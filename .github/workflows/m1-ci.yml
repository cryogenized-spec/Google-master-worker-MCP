name: M1/M2 TypeScript modules and MCP
on:
  push:
    branches: ["main", "feat/m1-core-tasks", "feat/m2-apps-script-lifecycle"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, build and protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
