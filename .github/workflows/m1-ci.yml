name: TypeScript and MCP checks
on:
  push:
    branches: ["main", "feat/m1-core-tasks", "feat/m2-apps-script-lifecycle", "feat/m3-worker-runtime26"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node 26 · Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          check-latest: true
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm test
