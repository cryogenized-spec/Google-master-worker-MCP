name: TypeScript and MCP checks
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node 26 · Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          check-latest: true
          package-manager-cache: false
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Verify actual local workerd OAuth and HTTP routing
        run: npm run test:runtime
      - name: Verify Cloudflare Worker bundle without deployment
        run: npx wrangler deploy --dry-run --outdir dist-worker
      - name: Verify OAuth authorization Worker bundle (no deployment)
        run: npx wrangler deploy --dry-run -c wrangler.auth.jsonc --outdir dist-auth
      - name: Verify protected MCP Worker bundle (no deployment)
        run: npx wrangler deploy --dry-run -c wrangler.protected-mcp.jsonc --outdir dist-mcp
      - name: Verify private Workspace setup Worker bundle (no deployment)
        run: npx wrangler deploy --dry-run -c wrangler.setup.jsonc --outdir dist-setup
      - name: Validate generated route-free Cloudflare staging configurations
        run: |
          # These are CI-only synthetic IDs; no Cloudflare resources or DNS records exist.
          node scripts/prepare-cloudflare.mjs --zone ci-synthetic-only.co.za --kv-id 0123456789abcdef0123456789abcdef --d1-id 01234567-89ab-cdef-0123-456789abcdef --db-name fake-ci-vault --auth-rate-id 11013 --setup-rate-id 11014
          node scripts/prepare-cloudflare.mjs --verify
          npx wrangler deploy --dry-run -c .wrangler-deploy.auth.jsonc --outdir dist-preflight-auth
          npx wrangler deploy --dry-run -c .wrangler-deploy.mcp.jsonc --outdir dist-preflight-mcp
          npx wrangler deploy --dry-run -c .wrangler-deploy.setup.jsonc --outdir dist-preflight-setup
