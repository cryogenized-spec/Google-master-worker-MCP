name: One-time dependency lockfile bootstrap (feature branch only)
on:
  push:
    branches: ["feat/m8-deployment-preflight"]

permissions:
  contents: write

jobs:
  lock:
    if: github.repository == 'cryogenized-spec/Google-master-worker-MCP'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          check-latest: true
          package-manager-cache: false
      - name: Generate exact npm lockfile (no lifecycle scripts)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to this feature branch only
        run: |
          git add -- package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: generate reproducible Node 26 npm lockfile"
          git push origin HEAD:feat/m8-deployment-preflight
